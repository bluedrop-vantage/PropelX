name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit tests, typecheck, lint, build — cheap, run on every push.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

  # Playwright E2E + axe-core WCAG 2.1 AA sweep. Runs in parallel with the
  # unit-test job so a broken browser test doesn't block engine work landing.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cache the Playwright browser install to avoid the 200MB download on
      # every run. The cache key is bound to the installed @playwright/test
      # version so upgrades invalidate it automatically.
      - name: Get Playwright version
        id: pw-version
        run: |
          echo "version=$(node -p "require('./packages/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright Chromium
        run: pnpm --filter @propelx/web e2e:install

      - name: Run E2E + axe-core suite
        run: pnpm --filter @propelx/web e2e

      # Upload the Playwright HTML report on failure so a reviewer can inspect
      # traces/screenshots/videos without re-running locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 14
